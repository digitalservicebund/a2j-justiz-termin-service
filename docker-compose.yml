services:
  postgres:
    image: postgres:18-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-a2j-justiz-termin-service}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: a2j-justiz-termin-service
      POSTGRES_USER: jts
      POSTGRES_PASSWORD: jts
    ports:
      # 5433 on the host so it can run next to other projects' Postgres on 5432.
      - "${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      # Postgres 18+ keeps its data in a versioned subdirectory below this path.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jts -d a2j-justiz-termin-service"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local SMTP mock: accepts any mail and keeps it in the container only, nothing is relayed.
  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: ${COMPOSE_PROJECT_NAME:-a2j-justiz-termin-service}-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      # SMTP on 2525, mapped to Mailpit's default 1025. Not the default SMTP-Port 587: macOS only lets
      # Docker bind ports below 1024 on 0.0.0.0, and the ports stay on 127.0.0.1 to keep them off the network.
      - "${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${SMTP_HOST_PORT:-2525}:1025"
      # Web UI and REST API.
      - "${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${MAILPIT_HOST_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
