services:
  postgres:
    image: postgres:18-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-a2j-justiz-termin-service}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: a2j-justiz-termin-service
      POSTGRES_USER: jts
      POSTGRES_PASSWORD: jts
    ports:
      # 5433 on the host so it can run next to other projects' Postgres on 5432.
      - "${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      # Postgres 18+ keeps its data in a versioned subdirectory below this path.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jts -d a2j-justiz-termin-service"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local SMTP mock: accepts any mail and keeps it in the container only, nothing is relayed.
  mailpit:
    image: axllent/mailpit:v1.34.0
    container_name: ${COMPOSE_PROJECT_NAME:-a2j-justiz-termin-service}-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      # SMTP on 2525, mapped to Mailpit's default 1025. Not the default SMTP-Port 587: macOS only lets
      # Docker bind ports below 1024 on 0.0.0.0, and the ports stay on 127.0.0.1 to keep them off the network.
      - "${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${SMTP_HOST_PORT:-2525}:1025"
      # Web UI and REST API.
      - "${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${MAILPIT_HOST_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local RabbitMQ broker without TLS. No volume: queues and messages are lost with the container.
  rabbitmq:
    image: rabbitmq:4.4.1-management-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-a2j-justiz-termin-service}-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: jts
      RABBITMQ_DEFAULT_PASS: jts
    ports:
      # 5673 and 15673 on the host so it can run next to other projects' RabbitMQ on 5672 and 15672.
      - "${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_HOST_PORT:-5673}:5672"
      # Management UI.
      - "${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_MANAGEMENT_HOST_PORT:-15673}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Local stand-in for the Basisdienst: ERV Versand (tests/mock-services/fake-erv-versand.ts).
  # It sets up the exchange and queues on the local RabbitMQ and answers every request without
  # sending anything. Its HTTP API lists the requests it received, for E2E tests and debugging.
  # It runs the repository's own code and node_modules, so run `pnpm install` before starting it.
  erv-versand:
    image: node:26.13.1-alpine3.23
    container_name: ${COMPOSE_PROJECT_NAME:-a2j-justiz-termin-service}-erv-versand
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    working_dir: /app
    command: ["node", "tests/mock-services/fake-erv-versand.ts"]
    ports:
      # HTTP API with the received requests: http://localhost:8045/messages
      - "${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${ERV_VERSAND_HOST_PORT:-8045}:8080"
    volumes:
      - .:/app:ro
    environment:
      HTTP_PORT: "8080"
      SECRETS_FILE_PATH: ""
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_VHOST: /
      RABBITMQ_USER: jts
      RABBITMQ_PASSWORD: jts
      RABBITMQ_TLS: "false"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
