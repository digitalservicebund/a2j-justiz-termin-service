name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
  # Allow to run this workflow manually
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.repository }}
  CONTAINER_IMAGE_VERSION: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Perform a clean install of node dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Check format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint:check

      - name: Run tests
        run: pnpm test

      - name: Run Playwright E2E tests
        timeout-minutes: 10
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # TODO: add this after implementing A11y tests
      #      - name: Install A11y test dependencies
      #        if: steps.cache-playwright-deps.outputs.cache-hit != 'true'
      #        run: pnpm exec playwright install --with-deps
      #
      #      - name: Run A11y tests
      #        run: pnpm test:a11y
      #        env:
      #          VITE_PORT: 4183
      #
      #      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      #        if: ${{ failure() }}
      #        with:
      #          name: playwright-a11y-test-results
      #          path: tests/a11y/playwright-report

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image to artifact
        run: docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} | gzip > image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docker-build
          path: image.tar.gz
          retention-days: 1

  build-and-push-image:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    needs:
      - build
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download Docker image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: docker-build

      - name: Load Docker image
        run: docker load --input image.tar.gz

      - name: Generate cosign vulnerability scan record
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          scanners: "vuln"
          format: "cosign-vuln"
          output: "vulnerabilities.json"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Login to container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: "ghcr.io"
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ghcr.io/${{ env.IMAGE_NAME }}
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push --all-tags ghcr.io/${{ env.IMAGE_NAME }}

      - name: Create SBOM
        uses: digitalservicebund/create-sbom@230fa356de826ac2a55dcc3ecc296abdd0ebff7a # main branch, latest full commit SHA
        with:
          image_name: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Sign the published Docker image
        run: cosign sign --yes ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Attest the vulnerability scan
        run: cosign attest --yes --replace --predicate vulnerabilities.json --type vuln ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

  vulnerability-scan:
    name: Vulnerability Scan
    needs: [build-and-push-image]
    uses: ./.github/workflows/scan.yml
    with:
      image-version: ${{ github.sha }}
    secrets: inherit
    permissions:
      contents: read
      security-events: write # trivy scan needs this

  deploy-staging:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: staging
    concurrency:
      group: deploy-staging-${{ github.repository }}
      cancel-in-progress: false
    needs: [build-and-push-image, vulnerability-scan]
    steps:
      - name: Deploy latest container image
        uses: digitalservicebund/argocd-deploy@355b2c4b9d9191a5048c8307f13e1cfc05150387 # v1.3.0
        with:
          environment: staging
          version: ${{ env.CONTAINER_IMAGE_VERSION }}
          deploying_repo: ${{ github.event.repository.name }}
          infra_repo: ${{ github.event.repository.name }}-infra
          github_app_client_id: ${{ secrets.GITOPS_A2J_APP_CLIENT_ID }}
          github_app_private_key: ${{ secrets.GITOPS_A2J_APP_PRIVATE_KEY }}
          app: ${{ github.event.repository.name }}-staging
          argocd_auth_token: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          argocd_server: ${{ secrets.ARGOCD_SERVER_STACKIT }}
          argocd_sync_timeout: 600

  deploy-production:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: production
    concurrency:
      group: deploy-production-${{ github.repository }}
      cancel-in-progress: false
    needs: [deploy-staging]
    steps:
      - name: Deploy latest container image
        uses: digitalservicebund/argocd-deploy@355b2c4b9d9191a5048c8307f13e1cfc05150387 # v1.3.0
        with:
          environment: production
          version: ${{ env.CONTAINER_IMAGE_VERSION }}
          deploying_repo: ${{ github.event.repository.name }}
          infra_repo: ${{ github.event.repository.name }}-infra
          github_app_client_id: ${{ secrets.GITOPS_A2J_APP_CLIENT_ID }}
          github_app_private_key: ${{ secrets.GITOPS_A2J_APP_PRIVATE_KEY }}
          app: ${{ github.event.repository.name }}-production
          argocd_auth_token: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          argocd_server: ${{ secrets.ARGOCD_SERVER_STACKIT }}
          argocd_sync_timeout: 600

