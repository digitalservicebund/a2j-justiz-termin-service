pre-commit:
  commands:
    adr-toc:
      glob: "doc/adr/*.md"
      run: pnpm adr:toc && git add doc/adr/README.md
    lint:
      run: pnpm lint:fix
    format-check:
      run: pnpm format:fix

pre-push:
  parallel: true
  commands:
    unit-tests:
      run: pnpm test
      only:
        - ref: main
    typecheck:
      run: pnpm typecheck
      only:
        - ref: main
